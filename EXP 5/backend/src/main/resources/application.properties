spring.application.name=exp5-backend

server.port=8080

# =========================
# H2 DATABASE
# =========================

spring.datasource.url=jdbc:h2:mem:exp5db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================
# H2 CONSOLE
# =========================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# OLLAMA
# =========================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=never

# =========================
# CORS
# =========================

app.cors.allowed-origins=http://localhost:5173

# =========================
# JWT
# =========================

app.jwt.secret=ZXhwNXB1bHNlYXBpLWp3dC1zZWNyZXQta2V5LWZvci1kZW1vLTIwMjY=
app.jwt.expiration=86400000

# =========================
# LOGGING
# =========================

logging.level.root=INFO
logging.level.com.example.exp5=INFO